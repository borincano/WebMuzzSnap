<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MuzzSnap | Protocol</title>

    <script>
        if (window.top !== window.self) {
            window.top.location.replace(window.self.location.href);
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Fira+Code&display=swap');
        body { background-color: #050505; color: white; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .logo-glow { box-shadow: 0 0 40px rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; cursor: pointer; }
        .logo-glow:active { transform: scale(0.95); }
        .loading-spinner { animation: spin 1s linear infinite; border: 3px solid transparent; border-top-color: #ff0000; border-radius: 50%; }
        .hacker-input { font-family: 'Fira Code', monospace; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,0,0,0.2); color: #39ff14; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sign-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.75); }
        .sign-overlay.hidden { display: none; }
        .sign-card { background: #111; border: 1px solid rgba(255,0,0,0.35); border-radius: 1rem; padding: 1.5rem; max-width: 18rem; text-align: center; }
    </style>
</head>
<body>

    <div class="text-center px-6 w-full max-w-sm">
        <div id="btnConnect" class="relative inline-block mb-6" onclick="accessWithWallet()">
            <div id="loadingUI" class="hidden absolute inset-0 z-20 flex items-center justify-center bg-black/50 rounded-3xl">
                <div class="loading-spinner w-12 h-12"></div>
            </div>
            <img src="https://img1.wsimg.com/isteam/ip/ac9578cb-a6ce-417e-8ad5-b2d6701462eb/1000030902.png/:/rs=w:1440,h:1440" 
                 class="logo-glow w-32 h-32 md:w-40 md:h-40 rounded-3xl">
        </div>

        <h1 style="font-family: 'Orbitron';" class="text-2xl font-black tracking-tighter italic mb-1">
            MUZZ<span class="text-red-600">SNAP</span>
        </h1>
        <p id="statusText" class="text-[10px] text-gray-500 uppercase tracking-[0.3em] mb-8">Tap logo for Wallet or use Guest below</p>

        <div class="space-y-4 mb-8">
            <input type="text" id="usernameInput" placeholder="ENTER_NICKNAME..." 
                   class="w-full p-3 rounded-xl hacker-input text-center text-xs border-dashed">
            <button onclick="accessWithGuest()" class="w-full py-2 text-[9px] font-bold text-gray-500 hover:text-red-500 uppercase tracking-widest transition-colors">
                [ Initialize Guest Protocol ]
            </button>
        </div>

        <div id="errorBox" class="hidden p-3 rounded-lg bg-red-900/20 border border-red-500/50 mb-6">
            <p id="errorTitle" class="text-red-500 text-[10px] font-bold uppercase mb-1"></p>
            <p id="errorDesc" class="text-gray-400 text-[10px] leading-tight"></p>
        </div>

        <div class="text-[9px] text-gray-700 font-mono uppercase tracking-widest">
            &copy; 2025 Protocol Ryachu Edition
        </div>
    </div>

    <div id="signOverlay" class="sign-overlay hidden">
        <div class="sign-card">
            <div class="loading-spinner w-10 h-10 mx-auto mb-3"></div>
            <h2 id="signStep" class="text-sm font-bold mb-2">Connecting wallet</h2>
            <p class="text-[11px] text-gray-400">Approve and sign in MetaMask, then return to this browser (Brave/Safari/Chrome).</p>
        </div>
    </div>

    <script>
        const loadingUI = document.getElementById('loadingUI');
        const errorBox = document.getElementById('errorBox');
        const signOverlay = document.getElementById('signOverlay');
        const statusText = document.getElementById('statusText');
        const signStep = document.getElementById('signStep');

        let mmSdk = null;

        function setStep(text) {
            statusText.innerText = text;
            signStep.innerText = text;
        }

        function showSigning(show) {
            signOverlay.classList.toggle('hidden', !show);
            loadingUI.classList.toggle('hidden', !show);
        }

        function showError(title, desc) {
            showSigning(false);
            errorBox.classList.remove('hidden');
            document.getElementById('errorTitle').innerText = title;
            document.getElementById('errorDesc').innerText = desc;
        }

        function isBraveWallet(provider) {
            return !!(provider && (provider.isBraveWallet || provider._isBraveWallet));
        }

        function isRealMetaMask(provider) {
            if (!provider) return false;
            // Brave Wallet can expose ethereum; never treat it as MetaMask.
            if (isBraveWallet(provider)) return false;
            return !!(provider.isMetaMask);
        }

        function collectInjectedProviders() {
            const list = [];
            const eth = window.ethereum;
            if (!eth) return list;
            if (Array.isArray(eth.providers)) {
                eth.providers.forEach((p) => { if (p) list.push(p); });
            }
            list.push(eth);
            return list;
        }

        /** Prefer real MetaMask via EIP-6963 + ethereum.providers. Do NOT return Brave Wallet. */
        function discoverInjectedProvider() {
            return new Promise((resolve) => {
                const found = [];
                const onAnnounce = (event) => found.push(event.detail);
                window.addEventListener('eip6963:announceProvider', onAnnounce);
                window.dispatchEvent(new Event('eip6963:requestProvider'));
                setTimeout(() => {
                    window.removeEventListener('eip6963:announceProvider', onAnnounce);

                    const from6963 = found.find((item) => {
                        const id = `${item.info?.rdns || ''} ${item.info?.name || ''}`.toLowerCase();
                        return id.includes('metamask') && !id.includes('brave');
                    });
                    if (from6963?.provider && isRealMetaMask(from6963.provider)) {
                        resolve(from6963.provider);
                        return;
                    }

                    const injected = collectInjectedProviders();
                    const mm = injected.find(isRealMetaMask);
                    // Intentionally null when only Brave Wallet is present — caller uses MM SDK deeplink.
                    resolve(mm || null);
                }, 150);
            });
        }

        async function connectMetaMaskSdk() {
            const mod = await import('https://esm.sh/@metamask/sdk@0.32.1');
            const MetaMaskSDK = mod.MetaMaskSDK || mod.default;
            if (!mmSdk) {
                mmSdk = new MetaMaskSDK({
                    dappMetadata: {
                        name: 'MuzzSnap',
                        url: window.location.origin,
                        iconUrl: new URL('muzzsnap.jpg', window.location.href).href
                    },
                    // Deeplink opens MetaMask for connect/sign only; site stays in Brave/Safari/Chrome
                    // (never use metamask.app.link/dapp/... which loads the whole site in MM).
                    useDeeplink: true,
                    checkInstallationImmediately: false,
                    enableAnalytics: false
                });
                if (typeof mmSdk.init === 'function') await mmSdk.init();
            }
            if (typeof mmSdk.connect === 'function') {
                await mmSdk.connect();
            }
            // Do not fall back to window.ethereum (may be Brave Wallet).
            return mmSdk.getProvider() || null;
        }

        async function getWalletProvider() {
            const injectedMm = await discoverInjectedProvider();
            if (injectedMm) return injectedMm;
            // No MetaMask injected (common on Brave mobile: only Brave Wallet) → force MetaMask app.
            return connectMetaMaskSdk();
        }

        async function accessWithWallet() {
            errorBox.classList.add('hidden');
            showSigning(true);
            setStep('Opening wallet...');

            try {
                if (typeof ethers === 'undefined') {
                    throw new Error('Wallet library failed to load.');
                }

                const rawProvider = await getWalletProvider();
                if (!rawProvider) {
                    throw new Error('NO_WALLET');
                }

                setStep('Requesting account...');
                const web3 = new ethers.providers.Web3Provider(rawProvider, 'any');
                await web3.send('eth_requestAccounts', []);
                const signer = web3.getSigner();
                const address = await signer.getAddress();
                if (!address) throw new Error('No wallet account detected.');

                setStep('Sign the verification');
                const issued = new Date().toISOString();
                const message = [
                    'MuzzSnap Login',
                    '',
                    'Sign this message to verify your wallet.',
                    'You will continue in this browser after signing.',
                    '',
                    'Wallet: ' + address,
                    'Issued: ' + issued
                ].join('\n');

                const signature = await signer.signMessage(message);
                const recovered = ethers.utils.verifyMessage(message, signature);
                if (String(recovered).toLowerCase() !== String(address).toLowerCase()) {
                    throw new Error('Signature does not match this wallet.');
                }

                sessionStorage.setItem('muzz_wallet_address', address);
                sessionStorage.setItem('muzz_login_sig', signature);
                sessionStorage.setItem('muzz_login_msg', message);
                setStep('Verified. Entering chat...');
                window.location.href = 'chat.html';
            } catch (err) {
                const msg = (err && (err.message || err.reason)) ? String(err.message || err.reason) : 'Connection rejected.';
                if (msg === 'NO_WALLET' || /no provider|sdk/i.test(msg)) {
                    showError(
                        'NO_WALLET',
                        'Instala MetaMask. En Brave/Safari/Chrome: al conectar se abrirá MetaMask para firmar (no uses Brave Wallet); luego vuelve a este navegador. No abras el sitio dentro de la app.'
                    );
                    return;
                }
                if (/rejected|denied|cancel/i.test(msg)) {
                    showError('SIGNATURE REQUIRED', 'Wallet connection or signature was rejected.');
                    return;
                }
                showError('AUTH_FAILED', msg);
            }
        }

        function accessWithGuest() {
            const user = document.getElementById('usernameInput').value.trim();
            if (!user) {
                showError("REQUIRED", "Ingresa un nickname.");
                return;
            }
            sessionStorage.setItem('muzz_wallet_address', `guest_${user}`);
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
