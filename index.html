<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuzzSnap Updating</title>
    <meta name="theme-color" content="#050505">
    <link rel="icon" href="muzzsnap.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff1a1a;
            --red-mid: #c40000;
            --red-deep: #6a0000;
            --red-glow: rgba(255, 20, 20, 0.45);
            --bg: #050505;
            --panel: #0c0c0c;
            --chrome: #d8d8d8;
            --chrome-dark: #3a3a3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .space {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% 35%, rgba(120, 0, 0, 0.28), transparent 62%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 0, 0.08), transparent 45%),
                linear-gradient(180deg, #000 0%, #0a0000 55%, #050505 100%);
        }

        .grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255, 30, 30, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 30, 30, 0.06) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 75%);
            pointer-events: none;
        }

        .scan {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 3px
            );
            opacity: 0.35;
        }

        .stage {
            position: relative;
            z-index: 3;
            flex: 1;
            width: 100%;
            max-width: 560px;
            padding: 48px 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        .title-block {
            text-align: center;
        }

        .title-block h1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(1.7rem, 6vw, 2.55rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #cfcfcf 38%, #8a8a8a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 0 #1a1a1a) drop-shadow(0 8px 18px rgba(255, 0, 0, 0.25));
        }

        .status-row {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .led {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
            box-shadow:
                0 0 8px var(--red),
                0 0 18px var(--red-glow);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .status {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.78rem, 2.4vw, 0.95rem);
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--red);
            text-shadow: 0 0 16px var(--red-glow);
        }

        .icon-bezel {
            position: relative;
            width: min(78vw, 280px);
            aspect-ratio: 1;
            padding: 12px;
            border-radius: 42px;
            background:
                linear-gradient(160deg, #5a5a5a 0%, #1c1c1c 22%, #0a0a0a 50%, #2a2a2a 78%, #111 100%);
            box-shadow:
                inset 0 2px 2px rgba(255, 255, 255, 0.35),
                inset 0 -6px 10px rgba(0, 0, 0, 0.75),
                0 2px 0 #777,
                0 6px 0 #1a1a1a,
                0 14px 0 #050505,
                0 22px 40px rgba(0, 0, 0, 0.75),
                0 0 60px rgba(255, 0, 0, 0.22);
            transform: perspective(900px) rotateX(6deg);
        }

        .icon-bezel::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 36px;
            border: 1px solid rgba(255, 40, 40, 0.45);
            box-shadow:
                0 0 18px rgba(255, 0, 0, 0.25),
                inset 0 0 18px rgba(255, 0, 0, 0.12);
            pointer-events: none;
        }

        .icon-bezel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 32px;
            display: block;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 168px;
            padding: 14px 28px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            border-radius: 14px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #ff4a4a 0%, #e01010 38%, #9a0000 100%);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.38),
                inset 0 -3px 0 rgba(80, 0, 0, 0.55),
                0 3px 0 #5a0000,
                0 8px 0 #220000,
                0 14px 28px rgba(255, 0, 0, 0.28);
        }

        .btn-secondary {
            color: #f2f2f2;
            background: linear-gradient(180deg, #2a2a2a 0%, #141414 50%, #0a0a0a 100%);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.16),
                inset 0 -3px 0 rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 30, 30, 0.45),
                0 3px 0 #3a0000,
                0 8px 0 #110000,
                0 14px 28px rgba(0, 0, 0, 0.45);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.45),
                0 1px 0 #220000;
        }

        footer {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 22px 16px 28px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.38);
        }

        footer span {
            color: var(--red);
            text-shadow: 0 0 10px var(--red-glow);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.82); }
        }

        @media (max-width: 480px) {
            .stage { gap: 22px; padding-top: 36px; }
            .icon-bezel { width: min(72vw, 230px); border-radius: 34px; }
            .btn { min-width: 0; flex: 1; padding: 14px 12px 16px; letter-spacing: 0.1em; }
        }

        @media (prefers-reduced-motion: reduce) {
            .led { animation: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="space"></div>
    <div class="grid"></div>
    <div class="scan"></div>

    <main class="stage">
        <header class="title-block">
            <h1>
                <span class="brand">MuzzSnap</span>
                <span class="status-row">
                    <span class="led" aria-hidden="true"></span>
                    <span class="status">Updating</span>
                </span>
            </h1>
        </header>

        <div class="icon-bezel">
            <img src="muzzsnap.jpg" alt="MuzzSnap">
        </div>

        <nav class="actions" aria-label="Main">
            <a class="btn btn-primary" href="login.html">MuzzChat</a>
            <a class="btn btn-secondary" href="https://muzzletoken.com" target="_blank" rel="noopener noreferrer">Web Muzz</a>
        </nav>
    </main>

    <footer>Powered by: <span>Ryashu &amp; Itsuki</span></footer>
</body>
</html>
